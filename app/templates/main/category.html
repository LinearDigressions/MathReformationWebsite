{% extends "base.html" %} 


{% block content %}

<h1 class="text-center">{{ category.name }}</h1>

<ul>
    {% for category_child in category.children %}
    <li>
        <a href = {{ url_for('main.category_page', path=category_child.path)}}>
            {{ category_child.name }}
        </a>
        <ul>
            {% for article in category_child.articles %} 
            <li>
                <a href = {{ url_for('main.article_page', path=article.path)}}>
                    {{ article.name }}
                </a>
            </li>
            {% endfor %}
        </ul>

    </li>
    {% endfor %}
</ul>

{% endblock %}
