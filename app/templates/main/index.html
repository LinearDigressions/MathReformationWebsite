{% extends "base.html" %} 


{% block content %}

<h1 class="text-center">Home Page</h1>
<ul>
    {% for category in main_categories %}
    {% if category.is_visible == True %} 

    <li>
        <a href = {{ url_for('main.category_page', path=category.path)}}>
            {{ category.name }}
        </a>
    </li>
    {% endif %} 
    {% endfor %}
</ul>

{% endblock %}
