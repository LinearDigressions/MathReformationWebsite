{% extends "base.html" %}
{% from 'macros/form_macros.html' import input %}



{% block content %}
    <h1>Submit Feedback</h1>
    <form action="" method="post" novalidate>
        {{ form.hidden_tag() }}
        {{ input(form.name) }}
        {{ input(form.email) }}
        {{ input(form.category)}}
        {{ input(form.text) }}
        <p>{{ form.submit() }}</p>
    </form>
{% endblock %}
