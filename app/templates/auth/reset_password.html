{% extends "base.html" %}
{% from 'macros/form_macros.html' import input %}



{% block content %}
    <h1>Reset Your Password</h1>
    <form action="" method="post">
        {{ form.hidden_tag() }}
        <p></p>
        {{ input(form.password, size= 32) }}
        {{ input(form.password2, size= 32) }}
        <p>{{ form.submit() }}</p>
    </form>
{% endblock %}
